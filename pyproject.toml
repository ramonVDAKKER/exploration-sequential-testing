[project]
name = "exploration-sequential-testing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ramonvdakker", email = "ramon.vdakker@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.3.3",
    "scipy>=1.16.2",
]

[project.scripts]
exploration-sequential-testing = "exploration_sequential_testing:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
]
